name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:full
      - run: npm test
      # Fails on genuine high/critical advisories, but tolerates the npm
      # registry's audit endpoint being unreachable, which otherwise turns an
      # outage into a red build.
      - name: Audit dependencies (high and critical)
        run: |
          set +e
          for attempt in 1 2 3; do
            npm audit --json > audit.json 2> audit.err
            if jq -e '.metadata.vulnerabilities' audit.json > /dev/null 2>&1; then
              high=$(jq '.metadata.vulnerabilities.high' audit.json)
              critical=$(jq '.metadata.vulnerabilities.critical' audit.json)
              echo "Advisories: $critical critical, $high high."
              if [ "$critical" -gt 0 ] || [ "$high" -gt 0 ]; then
                npm audit --audit-level=high
                exit 1
              fi
              exit 0
            fi
            echo "Attempt $attempt: the audit endpoint returned no report."
            cat audit.err
            sleep $(( attempt * 15 ))
          done
          echo "::warning::npm audit could not reach the registry after 3 attempts; the advisory gate did not run for this build."
          exit 0
      - name: Generate CycloneDX SBOM
        run: npx --yes @cyclonedx/cyclonedx-npm --output-format JSON --output-file sbom.cdx.json
      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.cdx.json

  security-scan:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7
      - name: OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@v2.6.0
        with:
          scan-args: --lockfile=package-lock.json
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,config
