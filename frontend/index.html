<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>CAMARA Emergency Demo — device density, geofence alerts and emergency routing</title>
    <meta
      name="description"
      content="Interactive demo of the CAMARA network APIs: live device density over an area, geofence alerts on a server-sent stream, emergency route planning and device location."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f7f5f2" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23ea580c'/%3E%3Cpath d='M22 13a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9' fill='none' stroke='%23fff' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <link rel="preload" href="/fonts/nunito-sans-latin.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Leaflet's and leaflet-draw's stylesheets are imported from the npm packages in
         src/, not linked from a CDN: the production CSP is `style-src 'self'`, which
         blocked the CDN links and left the map unstyled. -->
    <link rel="stylesheet" href="/styles.css"/>
    <script>
      /* Apply the stored or preferred theme before the first paint (no flash). */
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.setAttribute('data-theme', theme);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'dark' ? '#141312' : '#f7f5f2');
        } catch (e) {
          /* Storage unavailable (private mode, blocked cookies): keep the default. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding: 16px">
        This demo needs JavaScript to draw the map and talk to the CAMARA endpoints.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
